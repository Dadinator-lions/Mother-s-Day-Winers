<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leaderboard · Mother's Day Winers</title>
<link rel="stylesheet" href="/style.css" />
<script src="/util.js"></script>
</head>
<body>
<header class="app-header">
  <h1><a href="/">🍷 Mother's Day Winers</a></h1>
  <nav>
    <a href="/">Drink</a>
    <a href="/leaderboard.html" class="active">Leaderboard</a>
    <a href="/admin.html">Admin</a>
    <a href="#" id="logout">Logout</a>
  </nav>
</header>

<main class="container">

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="event">This Event</button>
      <button class="tab" data-tab="all">All Years</button>
    </div>

    <div data-tab-body="event">
      <div class="event-picker">
        <label for="event-select">Event:</label>
        <select id="event-select"></select>
        <button id="refresh" class="ghost">↻</button>
      </div>
      <p class="small" id="status"></p>
      <div id="event-results"></div>
    </div>

    <div data-tab-body="all" style="display:none;">
      <p class="small">Average scores across every Mother's Day, top to bottom.</p>
      <div id="history-results"></div>
    </div>
  </div>

</main>

<script>
const $ = (s) => document.querySelector(s);
$('#logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});

const eventSel = $('#event-select');
const eventDiv = $('#event-results');
const histDiv = $('#history-results');
const status = $('#status');
let refreshTimer = null;

// ---- tabs ----
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  document.querySelectorAll('[data-tab-body]').forEach(b => {
    b.style.display = b.dataset.tabBody === t.dataset.tab ? '' : 'none';
  });
}));

// ---- rendering ----

function podium(rows) {
  // Highest three with at least 1 vote.
  const scored = rows.filter(r => r.votes > 0).slice(0, 3);
  if (scored.length === 0) return '';
  const [first, second, third] = scored;
  const spot = (r, kind, medal) => r ? `
    <div class="spot ${kind}">
      <div class="medal">${medal}</div>
      <div class="wine-name">${r.name}</div>
      <div class="score">${r.avg_total}</div>
      <div class="score-sub">of 15 · ${r.votes} vote${r.votes === 1 ? '' : 's'}</div>
    </div>` : `<div class="spot ${kind}" style="visibility:hidden;"></div>`;
  // Visual: silver | gold | bronze
  return `<div class="podium">
    ${spot(second, 'silver', '🥈')}
    ${spot(first,  'gold',   '🥇')}
    ${spot(third,  'bronze', '🥉')}
  </div>`;
}

function wineCard(r, i) {
  const noVotes = !r.votes;
  const pct = r.avg_total ? Math.min(100, (r.avg_total / 15) * 100) : 0;
  return `
    <div class="wine-card ${noVotes ? 'no-votes' : ''}">
      <div class="rank-num">${i + 1}</div>
      <div>
        <div class="wname">${r.name}</div>
        <div class="breakdown">
          <span>Name <strong>${r.avg_name ?? '—'}</strong></span>
          <span>Label <strong>${r.avg_label ?? '—'}</strong></span>
          <span>Taste <strong>${r.avg_taste ?? '—'}</strong></span>
          <span>${r.votes || 0} vote${r.votes === 1 ? '' : 's'}${r.events_count ? ` · ${r.events_count} year${r.events_count === 1 ? '' : 's'}` : ''}</span>
        </div>
      </div>
      <div class="total">${r.avg_total ?? '—'}<small>of 15</small></div>
      <div class="bar"><span style="width:${pct}%"></span></div>
    </div>`;
}

function renderSection(title, kind, rows) {
  if (!rows.length) return '';
  return `
    <div class="section-heading">
      <h3>${title}</h3>
      <span class="pill">${kind === 'white_rose' ? 'White / Rosé' : 'Red'}</span>
    </div>
    ${podium(rows)}
    ${rows.map((r, i) => wineCard(r, i)).join('')}`;
}

function renderResults(target, rows) {
  if (!rows.length) {
    target.innerHTML = '<p class="small">No data yet. Ranks appear as votes come in.</p>';
    return;
  }
  const whites = rows.filter(r => r.category === 'white_rose');
  const reds   = rows.filter(r => r.category === 'red');
  target.innerHTML =
    renderSection('Whites & Rosés', 'white_rose', whites) +
    renderSection('Reds', 'red', reds);
}

// ---- data ----

async function loadEvents() {
  const events = await (await fetch('/api/events')).json();
  if (!events.length) {
    eventSel.innerHTML = '<option value="">No events yet</option>';
    eventDiv.innerHTML = '<p class="small">Create an event in Admin to start collecting scores.</p>';
    return;
  }
  eventSel.innerHTML = events.map(e => `<option value="${e.id}">${fmtDate(e.event_date)}</option>`).join('');
  const remembered = localStorage.getItem('mdw_event_id');
  if (remembered && events.find(e => String(e.id) === remembered)) eventSel.value = remembered;
  await loadEvent();
}

async function loadEvent() {
  if (!eventSel.value) { eventDiv.innerHTML = ''; return; }
  const rows = await (await fetch(`/api/events/${eventSel.value}/leaderboard`)).json();
  renderResults(eventDiv, rows);
  status.textContent = 'Live · last updated ' + new Date().toLocaleTimeString();
}

async function loadHistory() {
  const rows = await (await fetch('/api/history/wines')).json();
  renderResults(histDiv, rows);
}

eventSel.addEventListener('change', loadEvent);
$('#refresh').addEventListener('click', () => { loadEvent(); loadHistory(); });

(async () => {
  await loadEvents();
  await loadHistory();
  refreshTimer = setInterval(loadEvent, 10000);
})();
</script>
</body>
</html>
