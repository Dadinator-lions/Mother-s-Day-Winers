<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin · Mother's Day Winers</title>
<link rel="stylesheet" href="/style.css" />
<script src="/util.js"></script>
</head>
<body>
<header class="app-header">
  <h1>🍷 Mother's Day Winers</h1>
  <nav>
    <a href="/">Rank</a>
    <a href="/leaderboard.html">Leaderboard</a>
    <a href="/admin.html" class="active">Admin</a>
    <a href="#" id="logout">Logout</a>
  </nav>
</header>

<main class="container">
  <div class="card">
    <h2>Create event</h2>
    <form id="event-form" class="row">
      <input type="date" id="event-date" required />
      <button type="submit">Add event</button>
    </form>
    <p class="small">Existing events:</p>
    <ul id="event-list" class="simple-list"></ul>
  </div>

  <div class="card">
    <h2>Participants for event</h2>
    <div class="row">
      <label>Event:
        <select id="event-select"></select>
      </label>
    </div>
    <form id="participant-form" class="row" style="margin-top: 0.5rem;">
      <input type="text" id="participant-name" placeholder="Add participant name" required />
      <button type="submit">Add</button>
    </form>
    <ul id="participant-list" class="simple-list"></ul>
  </div>

  <div class="card">
    <h2>Wines for event</h2>
    <p class="small">Uncheck a wine to exclude it from this event. Wines apply per event; past events keep their lineup.</p>
    <div id="wine-list"></div>
    <h3 style="margin-top:1.25rem;">Add a new wine to the master list</h3>
    <form id="wine-form" class="row">
      <input type="text" id="wine-name" placeholder="Wine name" required />
      <select id="wine-category" required>
        <option value="white_rose">White / Rosé</option>
        <option value="red">Red</option>
      </select>
      <button type="submit">Add wine</button>
    </form>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
$('#logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});

const eventList = $('#event-list');
const eventSel = $('#event-select');
const partList = $('#participant-list');

async function loadEvents() {
  const events = await (await fetch('/api/events')).json();
  eventList.innerHTML = events.length
    ? events.map(e => `<li><span>${fmtDate(e.event_date)}</span><button class="ghost del-event" data-id="${e.id}">Delete</button></li>`).join('')
    : '<li class="small">No events yet.</li>';
  eventSel.innerHTML = events.length
    ? events.map(e => `<option value="${e.id}">${fmtDate(e.event_date)}</option>`).join('')
    : '<option value="">Create an event first</option>';
  eventList.querySelectorAll('.del-event').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this event and all its rankings?')) return;
    await fetch(`/api/events/${b.dataset.id}`, { method: 'DELETE' });
    await loadEvents();
    await loadParticipants();
  }));
  await loadParticipants();
}

async function loadParticipants() {
  partList.innerHTML = '';
  if (!eventSel.value) return;
  const ps = await (await fetch(`/api/events/${eventSel.value}/participants`)).json();
  partList.innerHTML = ps.length
    ? ps.map(p => `
        <li data-id="${p.id}">
          <span class="p-name">${p.name}</span>
          <span>
            <button class="ghost edit-p" data-id="${p.id}" data-name="${p.name.replace(/"/g, '&quot;')}">Edit</button>
            <button class="ghost del-p" data-id="${p.id}">Remove</button>
          </span>
        </li>`).join('')
    : '<li class="small">No participants yet.</li>';
  partList.querySelectorAll('.del-p').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this participant from the event? Their past rankings will also be deleted.')) return;
    await fetch(`/api/events/${eventSel.value}/participants/${b.dataset.id}`, { method: 'DELETE' });
    await loadParticipants();
  }));
  partList.querySelectorAll('.edit-p').forEach(b => b.addEventListener('click', async () => {
    const next = prompt('Edit name:', b.dataset.name);
    if (next == null) return;
    const trimmed = next.trim();
    if (!trimmed || trimmed === b.dataset.name) return;
    const res = await fetch(`/api/participants/${b.dataset.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: trimmed }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Could not rename.');
      return;
    }
    await loadParticipants();
  }));
}

$('#event-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const event_date = $('#event-date').value;
  await fetch('/api/events', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ event_date }),
  });
  $('#event-date').value = '';
  await loadEvents();
});

$('#participant-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!eventSel.value) return;
  const name = $('#participant-name').value.trim();
  if (!name) return;
  await fetch(`/api/events/${eventSel.value}/participants`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  $('#participant-name').value = '';
  await loadParticipants();
});

const wineList = document.getElementById('wine-list');

async function loadWines() {
  wineList.innerHTML = '';
  if (!eventSel.value) return;
  const wines = await (await fetch(`/api/events/${eventSel.value}/wines/all`)).json();
  const groups = { white_rose: [], red: [] };
  for (const w of wines) groups[w.category].push(w);
  const section = (title, list) => `
    <h3>${title}</h3>
    <ul class="simple-list">
      ${list.map(w => `
        <li data-id="${w.id}">
          <label style="display:flex; gap:0.5rem; align-items:center; flex:1;">
            <input type="checkbox" class="wine-toggle" data-id="${w.id}" ${w.included ? 'checked' : ''} />
            <span class="w-name">${w.name}</span>
          </label>
          <span>
            <button class="ghost edit-w" data-id="${w.id}" data-name="${w.name.replace(/"/g, '&quot;')}" data-category="${w.category}">Edit</button>
          </span>
        </li>`).join('')}
    </ul>`;
  wineList.innerHTML = section('Whites & Rosés', groups.white_rose) + section('Reds', groups.red);
  wineList.querySelectorAll('.wine-toggle').forEach(cb => cb.addEventListener('change', async () => {
    const url = `/api/events/${eventSel.value}/wines/${cb.dataset.id}`;
    await fetch(url, { method: cb.checked ? 'POST' : 'DELETE' });
  }));
  wineList.querySelectorAll('.edit-w').forEach(b => b.addEventListener('click', async () => {
    const next = prompt('Edit wine name:', b.dataset.name);
    if (next == null) return;
    const trimmed = next.trim();
    if (!trimmed) return;
    const res = await fetch(`/api/wines/${b.dataset.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: trimmed, category: b.dataset.category }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Could not rename.');
      return;
    }
    await loadWines();
  }));
}

document.getElementById('wine-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('wine-name').value.trim();
  const category = document.getElementById('wine-category').value;
  if (!name) return;
  const res = await fetch('/api/wines', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, category }),
  });
  if (!res.ok) { alert('Could not add wine.'); return; }
  // Include the new wine in the current event
  if (eventSel.value) {
    const wine = await res.json();
    await fetch(`/api/events/${eventSel.value}/wines/${wine.id}`, { method: 'POST' });
  }
  document.getElementById('wine-name').value = '';
  await loadWines();
});

eventSel.addEventListener('change', async () => { await loadParticipants(); await loadWines(); });

(async () => { await loadEvents(); await loadWines(); })();
</script>
</body>
</html>
